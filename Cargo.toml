[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["Ankerin"]

[workspace.dependencies]
slang-source = { path = "crates/slang-source" }
slang-layout = { path = "crates/slang-layout" }
slang-lexer = { path = "crates/slang-lexer" }
slang-preprocessor = { path = "crates/slang-preprocessor" }
slang-syntax = { path = "crates/slang-syntax" }
slang-module = { path = "crates/slang-module" }
slang-sema = { path = "crates/slang-sema" }
slang-ir = { path = "crates/slang-ir" }
slang-codegen = { path = "crates/slang-codegen" }
slang-compiler = { path = "crates/slang-compiler" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
