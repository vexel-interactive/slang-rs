name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: rustup run 1.99.1 cargo fmt --all -- --check
      - name: Check lints
        run: rustup run 1.99.1 cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: rustup run 1.99.1 cargo test --workspace --locked
      - name: Build documentation
        run: rustup run 1.99.1 cargo doc --workspace --no-deps --locked
